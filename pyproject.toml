[project]
name = "gstrecon"
version = "0.1.0"
description = "GST/TDS reconciliation exception engine: books-vs-GSTR-2B matching, exception classification, and an audit-defensible working paper."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Core (Phase 1-2): deterministic matching, classification, and the Excel
# working paper. No LLM/vector-store dependency belongs here -- the engine
# must run, and be tested, with zero network access.
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# Phase 3: retrieval-augmented explanation + chat layer. Kept optional so
# `pip install gstrecon` for the core engine never pulls in an OpenAI SDK,
# a Qdrant client, or FastAPI -- someone auditing just the matching logic
# shouldn't need them.
rag = [
    "openai>=1.50",
    # Pinned to the 1.11.x line to match the Qdrant *server* image pinned in
    # docker-compose.yml (v1.11.5) -- qdrant-client warns/can misbehave when
    # its major.minor drifts more than one minor version from the server.
    "qdrant-client>=1.11,<1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langfuse>=2.50",
    "ragas>=0.2",
    "pypdf>=4.3",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gstrecon = "gstrecon.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gstrecon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# "live" tests make real OpenAI API calls (small but real cost) -- excluded
# by default so routine `pytest`/`make test` runs stay free and offline.
# Run them explicitly with `make test-live` or `pytest -m live`.
addopts = '-m "not live"'
markers = ["live: makes real calls to external services (OpenAI, Qdrant); costs money, needs network"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() calls in parameter defaults are typer's
# documented, required usage pattern -- not the mutable-default-argument
# footgun B008 exists to catch.
"src/gstrecon/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "types-openpyxl>=3.1.5.20260827",
]
